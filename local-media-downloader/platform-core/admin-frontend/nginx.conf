server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location ~* ^/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every real route is client-side (React Router) -
    # the staging reverse proxy in front of this container already routes
    # /api/*, /oauth/*, /.well-known/*, /health and /ready to the backend
    # instead, so nothing under those paths ever reaches here.
    location / {
        try_files $uri /index.html;
    }
}
