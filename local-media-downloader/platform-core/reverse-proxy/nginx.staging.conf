# Platform Core staging reverse proxy (mission 4, phase 6).
#
# Single staging hostname, path-routed to backend vs. admin-frontend - the
# same same-origin pattern Loady's own production reverse proxy already
# uses (see /frontend/nginx.tls.conf), which keeps session cookies simple
# (no cross-subdomain SameSite/CORS story needed) while a later production
# deployment can still split this into separate `auth.<domain>` /
# `admin.<domain>` hosts by changing only PLATFORM_STAGING_HOST,
# VITE_PLATFORM_API_BASE_URL and the CORS/cookie-domain settings - nothing
# structural here assumes a single host forever.
#
# TLS cert/key are mounted from ./secrets/tls (generate-staging-cert.sh) -
# self-signed for local staging, swapped for a real certificate (or an
# upstream TLS-terminating proxy/Cloudflare) in production without any
# other change to this file.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Backend: OIDC/OAuth, JWKS, API, health/readiness -------------------
    location ~ ^/(api/|oauth/|\.well-known/) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness/readiness are deliberately NOT rate-limited and are cheap,
    # unauthenticated GETs - orchestrator/health-check traffic only.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://backend:8000/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else: Grand Admin's static production build -----------
    location / {
        proxy_pass http://admin-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
