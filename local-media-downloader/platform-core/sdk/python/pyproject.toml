[project]
name = "platform-client"
version = "0.1.0"
description = "Reference server-side integration library for products joining the ecosystem (Platform Core SSO, entitlements, service auth)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_client*"]
