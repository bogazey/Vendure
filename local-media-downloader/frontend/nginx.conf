server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /api/progress/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location ~ ^/(en|ar)(/(video-downloader|audio-downloader|image-downloader))?/?$ {
        try_files $uri $uri/index.html =404;
    }

    location = / { try_files /index.html =404; }
    location ~ ^/(pricing|login|signup|forgot-password|reset-password|verify-email|terms|privacy|copyright|acceptable-use|refund-policy|dashboard|history|settings|account|billing|usage)/?$ {
        try_files /index.html =404;
    }
    location ~ ^/admin(/(users|billing|activity|system|ads|statistics))?/?$ {
        try_files /index.html =404;
    }

    location / { return 404; }
}
