server {
    listen 80;
    server_name loady.cc www.loady.cc;
    return 301 https://loady.cc$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name loady.cc;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /api/progress/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare's own coarse country lookup, forwarded verbatim so the
        # backend can show approximate visitor geography (see
        # docs/ANALYTICS.md) without Loady ever storing an IP address.
        # Trustworthy here because only Cloudflare's edge can reach this
        # origin (same trust boundary cloudflare-realip.conf already
        # establishes for CF-Connecting-IP).
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
    location ~* ^/assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location ~ ^/(en|ar)(/(video-downloader|audio-downloader|image-downloader))?/?$ { try_files $uri $uri/index.html =404; }
    location = / { try_files /index.html =404; }
    location ~ ^/(pricing|login|signup|forgot-password|reset-password|verify-email|terms|privacy|copyright|acceptable-use|refund-policy|dashboard|history|settings|account|billing|usage)/?$ { try_files /index.html =404; }
    location ~ ^/admin(/(users|billing|activity|system|ads|statistics))?/?$ { try_files /index.html =404; }
    location / { return 404; }
}
