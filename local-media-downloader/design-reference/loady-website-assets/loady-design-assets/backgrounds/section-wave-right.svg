<rect width="1000" height="700" fill="none"/>
<path d="M-80,120 C160,250 360,40 620,220 C810,350 900,310 1080,510"
 fill="none" stroke="url(#brand)" stroke-width="14" opacity=".28" filter="url(#glow)"/>

