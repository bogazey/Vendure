<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">



<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#3B82F6"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<circle cx="256" cy="256" r="190" fill="#0B1220" stroke="url(#brand)" stroke-width="6"/>
<circle cx="256" cy="256" r="150" fill="#3B82F6" opacity=".06"/>
<text x="256" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="180" fill="#F4F7FF">✓</text>

</svg>
