services:
  reverse-proxy:
    ports:
      - "443:443"
    volumes:
      - ./secrets/tls:/etc/nginx/tls:ro
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/robots.txt"]
